
spring:
  application:
    name: parkwise

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5435/parkwise?options=-c%20TimeZone%3DUTC}
    username: ${DB_USERNAME:parkwise}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
